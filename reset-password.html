
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - Abhishek Shop</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      width: min(360px, 85%);
    }
    h2 { text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #475569;
      font-size: 15px;
    }
    input { background: #0f172a; color: white; }
    button {
      background: #16a34a;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    #message { line-height: 1.5; overflow-wrap: anywhere; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Abhishek Shop</h2>
    <p id="description">Reset your account password securely.</p>

    <div id="requestBox">
      <h3>Request password reset</h3>
      <input id="email" type="email"
        placeholder="Your registered email" required>
      <button id="sendBtn">Send Reset Link</button>
    </div>

    <div id="resetBox" class="hidden">
      <h3>Create New Password</h3>
      <input id="password" type="password"
        placeholder="New password (minimum 8 characters)">
      <input id="confirmPassword" type="password"
        placeholder="Confirm new password">
      <button id="saveBtn">Save New Password</button>
    </div>

    <p id="message"></p>
  </div>

<script>
const SUPABASE_URL = "https://abulaaaezuajnuobzsdj.supabase.co";
const SUPABASE_KEY = "sb_publishable_ae6FQ3C13ru6drINn53jDA_THBBArV5";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");
const requestBox = document.getElementById("requestBox");
const resetBox = document.getElementById("resetBox");

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.color = success ? "#4ade80" : "#f87171";
}

async function checkRecoverySession() {
  const params = new URLSearchParams(location.hash.substring(1));
  const query = new URLSearchParams(location.search);
  const type = params.get("type") || query.get("type");

  if (type === "recovery") {
    const accessToken = params.get("access_token");
    const refreshToken = params.get("refresh_token");

    if (accessToken && refreshToken) {
      const { error } = await db.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });

      if (error) {
        showMessage("Link error: " + error.message);
        return;
      }
    }
  }

  const { data } = await db.auth.getSession();

  if (data.session) {
    requestBox.classList.add("hidden");
    resetBox.classList.remove("hidden");
    document.getElementById("description").textContent =
      "Enter your new password below.";
    history.replaceState(null, "", location.pathname);
  } else {
    showMessage("Enter your registered email to receive a reset link.", true);
  }
}

document.getElementById("sendBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    showMessage("Please enter your registered email.");
    return;
  }

  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  btn.textContent = "Sending...";

  const redirectTo = location.origin +
    location.pathname;

  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo
  });

  btn.disabled = false;
  btn.textContent = "Send Reset Link";

  if (error) {
    showMessage(error.message);
  } else {
    showMessage(
      "Reset link sent. Check your Gmail Inbox and Spam folder.",
      true
    );
  }
});

document.getElementById("saveBtn").addEventListener("click", async () => {
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirmPassword").value;

  if (password.length < 8) {
    showMessage("Password must contain at least 8 characters.");
    return;
  }

  if (password !== confirm) {
    showMessage("Passwords do not match.");
    return;
  }

  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  btn.textContent = "Saving...";

  const { error } = await db.auth.updateUser({ password });

  btn.disabled = false;
  btn.textContent = "Save New Password";

  if (error) {
    showMessage(error.message);
  } else {
    showMessage(
      "Password updated successfully! You can now log in.",
      true
    );
    resetBox.classList.add("hidden");
    await db.auth.signOut();
  }
});

checkRecoverySession();
</script>
</body>
</html>
