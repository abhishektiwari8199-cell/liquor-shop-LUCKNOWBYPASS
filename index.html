<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Playfair Display', serif; }
        .glass-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
    <script>
        function switchTab(tabName) {
            let beerSec = document.getElementById('beer_section');
            let liquorSec = document.getElementById('liquor_section');
            let btnBeer = document.getElementById('btn_beer');
            let btnLiq = document.getElementById('btn_liq');

            if (tabName === 'beer') {
                beerSec.style.display = 'block';
                liquorSec.style.display = 'none';
                btnBeer.className = "px-6 py-2.5 rounded-xl text-xs font-bold bg-amber-500 text-zinc-950 shadow-lg transition-all";
                btnLiq.className = "px-6 py-2.5 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition-all";
            } else {
                beerSec.style.display = 'none';
                liquorSec.style.display = 'block';
                btnLiq.className = "px-6 py-2.5 rounded-xl text-xs font-bold bg-amber-500 text-zinc-950 shadow-lg transition-all";
                btnBeer.className = "px-6 py-2.5 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition-all";
            }
        }

        function calculateRow(prefix, id) {
            let op = parseFloat(document.getElementById(prefix + '_op_' + id).value) || 0;
            let pur = parseFloat(document.getElementById(prefix + '_pur_' + id).value) || 0;
            let mrp = parseFloat(document.getElementById(prefix + '_mrp_' + id).value) || 0;
            let sale = parseFloat(document.getElementById(prefix + '_sale_' + id).value) || 0;

            let purchTotal = pur * mrp;
            let saleTotal = sale * mrp;
            let closing = (op + pur) - sale;
            let stockVal = closing * mrp;

            document.getElementById(prefix + '_ptot_' + id).innerText = purchTotal.toFixed(2);
            document.getElementById(prefix + '_stot_' + id).innerText = saleTotal.toFixed(2);
            document.getElementById(prefix + '_close_' + id).innerText = closing;
            document.getElementById(prefix + '_sval_' + id).innerText = stockVal.toFixed(2);
        }
    </script>
</head>
