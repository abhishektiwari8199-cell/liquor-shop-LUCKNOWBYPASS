<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhishek Enterprises | Master Portal - Lucknow Bypass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Playfair Display', serif; }
        .glass-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
    <script>
        function switchTab(tabName) {
            let beerSec = document.getElementById('beer_section');
            let liquorSec = document.getElementById('liquor_section');
            let btnBeer = document.getElementById('btn_beer');
            let btnLiq = document.getElementById('btn_liq');

            if (tabName === 'beer') {
                beerSec.style.display = 'block';
                liquorSec.style.display = 'none';
                btnBeer.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-amber-500 text-zinc-950 shadow-lg transition-all";
                btnLiq.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition-all";
            } else {
                beerSec.style.display = 'none';
                liquorSec.style.display = 'block';
                btnLiq.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-amber-500 text-zinc-950 shadow-lg transition-all";
                btnBeer.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition-all";
            }
        }

        function calculateRow(prefix, id) {
            let op = parseFloat(document.getElementById(prefix + '_op_' + id).value) || 0;
            let pur = parseFloat(document.getElementById(prefix + '_pur_' + id).value) || 0;
            let mrp = parseFloat(document.getElementById(prefix + '_mrp_' + id).value) || 0;
            let sale = parseFloat(document.getElementById(prefix + '_sale_' + id).value) || 0;

            let purchTotal = pur * mrp;
            let saleTotal = sale * mrp;
            let closing = (op + pur) - sale;
            let stockVal = closing * mrp;

            document.getElementById(prefix + '_ptot_' + id).innerText = purchTotal.toFixed(2);
            document.getElementById(prefix + '_stot_' + id).innerText = saleTotal.toFixed(2);
            document.getElementById(prefix + '_close_' + id).innerText = closing;
            document.getElementById(prefix + '_sval_' + id).innerText = stockVal.toFixed(2);
        }
    </script>
</head>
<body class="bg-gradient-to-br from-gray-950 via-zinc-900 to-stone-950 text-gray-100 min-h-screen">
    
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-zinc-900/90 backdrop-blur-md border-b border-amber-900/30 sticky top-0 z-50 py-3 px-4 flex justify-between items-center shadow-lg">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🍷</span>
                <div>
                    <h1 class="text-sm font-bold tracking-wide heading-font text-amber-500">ABHISHEK ENTERPRISES</h1>
                    <p class="text-[10px] text-zinc-400">LUCKNOW BYPASS UNIT</p>
                </div>
            </div>
            <div class="flex items-center space-x-1.5 bg-amber-500/10 border border-amber-500/30 px-2.5 py-1 rounded-full text-amber-400 text-[10px] font-medium">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Live</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-3 py-4 max-w-7xl">
            
            <!-- Summary Cards -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="glass-card p-3 rounded-xl border-l-4 border-amber-500 shadow">
                    <p class="text-[10px] text-zinc-400 uppercase font-semibold">Gross Sale</p>
                    <h3 class="text-lg font-bold text-amber-400 mt-0.5 heading-font">₹ 0.00</h3>
                </div>
                <div class="glass-card p-3 rounded-xl border-l-4 border-blue-500 shadow">
                    <p class="text-[10px] text-zinc-400 uppercase font-semibold">Total Purchase</p>
                    <h3 class="text-lg font-bold text-blue-400 mt-0.5 heading-font">₹ 0.00</h3>
                </div>
                <div class="glass-card p-3 rounded-xl border-l-4 border-emerald-500 shadow">
                    <p class="text-[10px] text-zinc-400 uppercase font-semibold">Net Received</p>
                    <h3 class="text-lg font-bold text-emerald-400 mt-0.5 heading-font">₹ 0.00</h3>
                </div>
                <div class="glass-card p-3 rounded-xl border-l-4 border-rose-500 shadow">
                    <p class="text-[10px] text-zinc-400 uppercase font-semibold">Expenses</p>
                    <h3 class="text-lg font-bold text-rose-400 mt-0.5 heading-font">₹ 0.00</h3>
                </div>
            </div>

            <!-- Tab Switcher (Beer / Liquor Buttons) -->
            <div class="glass-card p-3 rounded-xl shadow border border-zinc-800 mb-4 flex space-x-2">
                <button id="btn_beer" onclick="switchTab('beer')" class="flex-1 py-2.5 rounded-xl text-xs font
