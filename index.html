    <style>
        body { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Playfair Display', serif; }
        .glass-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
    <script>
        function switchTab(tabName) {
            document.getElementById('liquor_tab').style.display = tabName === 'liquor' ? 'block' : 'none';
            document.getElementById('beer_tab').style.display = tabName === 'beer' ? 'block' : 'none';
            document.getElementById('daybook_tab').style.display = tabName === 'daybook' ? 'block' : 'none';

            let btnLiq = document.getElementById('btn_liq');
            let btnBeer = document.getElementById('btn_beer');
            let btnDay = document.getElementById('btn_day');

            btnLiq.className = tabName === 'liquor' ? "px-5 py-2.5 rounded-xl text-xs font-bold bg-amber-500 text-zinc-950 shadow-lg transition-all" : "px-5 py-2.5 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition-all";
            btnBeer.className = tabName === 'beer' ? "px-5 py-2.5 rounded-xl text-xs font-bold bg-amber-500 text-zinc-950 shadow-lg transition-all" : "px-5 py-2.5 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition-all";
            btnDay.className = tabName === 'daybook' ? "px-5 py-2.5 rounded-xl text-xs font-bold bg-amber-500 text-zinc-950 shadow-lg transition-all" : "px-5 py-2.5 rounded-xl text-xs font-bold bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition-all";
        }

        function calculateBeerRow(id) {
            let op = parseFloat(document.getElementById('beer_op_' + id).value) || 0;
            let pur = parseFloat(document.getElementById('beer_pur_' + id).value) || 0;
            let mrp = parseFloat(document.getElementById('beer_mrp_' + id).value) || 0;
            let sale = parseFloat(document.getElementById('beer_sale_' + id).value) || 0;

            let purchTotal = pur * mrp;
            let saleTotal = sale * mrp;
            let closing = (op + pur) - sale;
            let stockVal = closing * mrp;

            document.getElementById('beer_ptot_' + id).innerText = purchTotal.toFixed(2);
            document.getElementById('beer_stot_' + id).innerText = saleTotal.toFixed(2);
            document.getElementById('beer_close_' + id).innerText = closing;
            document.getElementById('beer_sval_' + id).innerText = stockVal.toFixed(2);

            updateGrandTotals();
        }

        function updateGrandTotals() {
            let totalSale = parseFloat(document.getElementById('beer_stot_1')?.innerText || 0) + 
                            parseFloat(document.getElementById('beer_stot_2')?.innerText || 0) + 
                            parseFloat(document.getElementById('beer_stot_3')?.innerText || 0);

            document.getElementById('card_sales').innerText = "₹ " + totalSale.toFixed(2);
            let expenses = parseFloat(document.getElementById('exp_val').value) || 0;
            let netReceived = totalSale - expenses;
            document.getElementById('card_net').innerText = "₹ " + netReceived.toFixed(2);
        }
    </script>
</head>
