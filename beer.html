<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beer Register | Abhishek Enterprises</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Playfair Display', serif; }
        .glass-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
    <script>
        function calculateRow(id) {
            let op = parseFloat(document.getElementById('op_' + id).value) || 0;
            let pur = parseFloat(document.getElementById('pur_' + id).value) || 0;
            let sale = parseFloat(document.getElementById('sale_' + id).value) || 0;
            let closing = (op + pur) - sale;
            document.getElementById('close_' + id).innerText = closing;
        }
    </script>
</head>
<body class="bg-gradient-to-br from-gray-950 via-zinc-900 to-stone-950 text-gray-100 min-h-screen flex flex-col justify-between">
    
    <!-- Header -->
    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-amber-900/30 py-3 px-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <a href="index.html" class="text-amber-400 text-sm font-bold bg-zinc-800 px-3 py-1.5 rounded-lg hover:bg-zinc-700">← Back</a>
            <h1 class="text-sm font-bold tracking-wide heading-font text-amber-500">BEER REGISTER</h1>
        </div>
        <span class="text-[10px] text-zinc-400">Lucknow Bypass Unit</span>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-3 py-4 max-w-4xl flex-grow">
        <div class="glass-card rounded-xl shadow-xl overflow-hidden border border-zinc-800">
            <div class="px-4 py-3 bg-zinc-900/90 border-b border-zinc-800 flex justify-between items-center">
                <h3 class="text-xs font-bold text-amber-100 heading-font">🍺 Complete Beer Inventory Sheet</h3>
                <span class="text-[10px] text-amber-400">Rate Card Active</span>
            </div>
            <div class="p-2 overflow-x-auto">
                <table class="w-full text-left border-collapse text-[11px]">
                    <thead>
                        <tr class="bg-zinc-900 text-zinc-400 uppercase border-b border-zinc-700">
                            <th class="p-2">#</th>
                            <th class="p-2">Beer Brand Name</th>
                            <th class="p-2">MRP</th>
                            <th class="p-2">Op</th>
                            <th class="p-2">Pur</th>
                            <th class="p-2">Sale</th>
                            <th class="p-2 text-emerald-400">Close</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-zinc-800 text-zinc-300">
                        <tr><td class="p-2">1</td><td class="p-2 font-semibold text-white">KINGFISHER - 650 ML</td><td class="p-2 text-amber-400">₹190</td><td class="p-2"><input type="number" id="op_1" value="0" oninput="calculateRow(1)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2"><input type="number" id="pur_1" value="0" oninput="calculateRow(1)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2"><input type="number" id="sale_1" value="0" oninput="calculateRow(1)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2 font-bold text-emerald-400 text-center" id="close_1">0</td></tr>
                        <tr><td class="p-2">2</td><td class="p-2 font-semibold text-white">ULTRAMAX - 650 ML</td><td class="p-2 text-amber-400">₹210</td><td class="p-2"><input type="number" id="op_2" value="0" oninput="calculateRow(2)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2"><input type="number" id="pur_2" value="0" oninput="calculateRow(2)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2"><input type="number" id="sale_2" value="0" oninput="calculateRow(2)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2 font-bold text-emerald-400 text-center" id="close_2">0</td></tr>
                        <tr><td class="p-2">3</td><td class="p-2 font-semibold text-white">TUBORG - 650 ML</td><td class="p-2 text-amber-400">₹190</td><td class="p-2"><input type="number" id="op_3" value="0" oninput="calculateRow(3)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2"><input type="number" id="pur_3" value="0" oninput="calculateRow(3)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2"><input type="number" id="sale_3" value="0" oninput="calculateRow(3)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2 font-bold text-emerald-400 text-center" id="close_3">0</td></tr>
                        <tr><td class="p-2">4</td><td class="p-2 font-semibold text-white">ELEPHANT - 650 ML</td><td class="p-2 text-amber-400">₹210</td><td class="p-2"><input type="number" id="op_4" value="0" oninput="calculateRow(4)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2"><input type="number" id="pur_4" value="0" oninput="calculateRow(4)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2"><input type="number" id="sale_4" value="0" oninput="calculateRow(4)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2 font-bold text-emerald-400 text-center" id="close_4">0</td></tr>
                        <tr><td class="p-2">5</td><td class="p-2 font-semibold text-white">BROCODE - 375 ML CAN</td><td class="p-2 text-amber-400">₹150</td><td class="p-2"><input type="number" id="op_5" value="0" oninput="calculateRow(5)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2"><input type="number" id="pur_5" value="0" oninput="calculateRow(5)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2"><input type="number" id="sale_5" value="0" oninput="calculateRow(5)" class="w-10 bg-zinc-800 border border-zinc-700 rounded text-center text-white"></td><td class="p-2 font-bold text-emerald-400 text-center" id="close_5">0</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-zinc-950 border-t border-zinc-900 py-3 text-center text-[10px] text-zinc-500">
        <p>Abhishek Enterprises &copy; 2026</p>
    </footer>

</body>
</html>
