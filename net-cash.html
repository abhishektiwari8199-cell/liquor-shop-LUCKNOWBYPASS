<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Cash & Drawer Register | Abhishek Enterprises</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Playfair Display', serif; }
        .glass-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
    <script>
        function calculateNetCash() {
            let cashSale = parseFloat(document.getElementById('drawer_cash').value) || 0;
            let upiSale = parseFloat(document.getElementById('drawer_upi').value) || 0;
            let cashExp = parseFloat(document.getElementById('drawer_expense').value) || 0;

            let totalReceived = cashSale + upiSale;
            let netCashInHand = cashSale - cashExp;

            document.getElementById('display_total_received').innerText = '₹ ' + totalReceived.toFixed(2);
            document.getElementById('display_net_cash').innerText = '₹ ' + netCashInHand.toFixed(2);
        }
    </script>
</head>
<body class="bg-gradient-to-br from-gray-950 via-zinc-900 to-stone-950 text-gray-100 min-h-screen flex flex-col justify-between">
    
    <!-- Header -->
    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-amber-900/30 py-3 px-4 flex justify-between items-center shadow-lg sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <a href="index.html" class="text-amber-400 text-sm font-bold bg-zinc-800 px-3 py-1.5 rounded-lg hover:bg-zinc-700">← Back</a>
            <h1 class="text-sm font-bold tracking-wide heading-font text-emerald-400">NET CASH & DRAWER REGISTER</h1>
        </div>
        <span class="text-[10px] text-zinc-400">Lucknow Bypass Unit</span>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-3 py-6 max-w-4xl flex-grow space-y-6">
        
        <!-- Summary Cards Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="glass-card p-5 rounded-2xl border-l-4 border-emerald-500 shadow-xl text-center">
                <p class="text-xs uppercase tracking-wider text-zinc-400 font-semibold">Total Collection (Cash + UPI)</p>
                <h2 id="display_total_received" class="text-2xl font-bold text-emerald-400 mt-2 heading-font">₹ 0.00</h2>
                <p class="text-[11px] text-zinc-400 mt-1">Combined gross receipts</p>
            </div>
            <div class="glass-card p-5 rounded-2xl border-l-4 border-blue-500 shadow-xl text-center">
                <p class="text-xs uppercase tracking-wider text-zinc-400 font-semibold">Net Cash in Drawer (In-Hand)</p>
                <h2 id="display_net_cash" class="text-2xl font-bold text-blue-400 mt-2 heading-font">₹ 0.00</h2>
                <p class="text-[11px] text-zinc-400 mt-1">Physical cash after deductions</p>
            </div>
        </div>

        <!-- Input Form Card -->
        <div class="glass-card p-5 rounded-2xl shadow-xl border border-zinc-800 space-y-4">
            <h3 class="text-xs font-bold text-emerald-200 heading-font uppercase tracking-wider border-b border-zinc-800 pb-2">💵 Counter Cash & UPI Reconciliation</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-[11px] text-zinc-400 mb-1 font-medium">Counter Cash Sale (₹)</label>
                    <input type="number" id="drawer_cash" value="0" oninput="calculateNetCash()" class="w-full bg-zinc-800 border border-zinc-700 text-xs px-3 py-2 rounded-xl text-white focus:outline-none focus:border-emerald-500 font-bold">
                </div>
                <div>
                    <label class="block text-[11px] text-zinc-400 mb-1 font-medium">Online / UPI Sale (₹)</label>
                    <input type="number" id="drawer_upi" value="0" oninput="calculateNetCash()" class="w-full bg-zinc-800 border border-zinc-700 text-xs px-3 py-2 rounded-xl text-white focus:outline-none focus:border-emerald-500 font-bold">
                </div>
                <div>
                    <label class="block text-[11px] text-zinc-400 mb-1 font-medium">Cash Expenses Paid (₹)</label>
                    <input type="number" id="drawer_expense" value="0" oninput="calculateNetCash()" class="w-full bg-zinc-800 border border-zinc-700 text-xs px-3 py-2 rounded-xl text-white focus:outline-none focus:border-emerald-500 font-bold">
                </div>
            </div>

            <div class="pt-4">
                <button onclick="alert('Net cash drawer successfully reconciled!')" class="w-full py-2.5 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-lg hover:bg-emerald-500 transition-all">
                    💾 Save & Sync Cash Drawer
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-zinc-950 border-t border-zinc-900 py-3 text-center text-[10px] text-zinc-500">
        <p>Abhishek Enterprises &copy; 2026 | Lucknow Bypass Unit</p>
    </footer>

</body>
</html>
