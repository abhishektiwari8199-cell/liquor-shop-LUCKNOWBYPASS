        body { font-family: 'Inter', sans-serif; }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
    <script>
        function checkAccess() {
            let pass = prompt("🔐 Yeh secure inventory area hai. Kripya Admin Password darj karein:");
            if (pass !== "abhishek123") {
                alert("❌ Galat password! Access denied.");
                window.location.href = "index.html";
            }
        }

        window.onload = function() {
            checkAccess();
            loadSavedInventory();
        };

        function calculateRow(id) {
            let op = parseFloat(document.getElementById('op_' + id).value) || 0;
            let pur = parseFloat(document.getElementById('pur_' + id).value) || 0;
            let sale = parseFloat(document.getElementById('sale_' + id).value) || 0;
            let mrp = parseFloat(document.getElementById('mrp_' + id).value) || 0;
            let ws = parseFloat(document.getElementById('ws_' + id).value) || 0;

            let closing = (op + pur) - sale;
            document.getElementById('close_' + id).innerText = closing;

            let stockValue = closing * mrp;
            document.getElementById('val_' + id).innerText = '₹ ' + stockValue.toFixed(2);

            let profit = sale * (mrp - ws);
            document.getElementById('prof_' + id).innerText = '₹ ' + profit.toFixed(2);

            updateGrandTotals();
        }

        function updateGrandTotals() {
            let totalSalesAmount = 0;
            let totalPurchaseCost = 0;
            let totalProfit = 0;
            let totalExpenses = parseFloat(document.getElementById('daily_expense').value) || 0;

            for (let i = 1; i <= 111; i++) {
                let saleInput = document.getElementById('sale_' + i);
                let mrpInput = document.getElementById('mrp_' + i);
                let wsInput = document.getElementById('ws_' + i);
                let purInput = document.getElementById('pur_' + i);

                if (saleInput && mrpInput && wsInput) {
                    let saleQty = parseFloat(saleInput.value) || 0;
                    let mrp = parseFloat(mrpInput.value) || 0;
                    let ws = parseFloat(wsInput.value) || 0;
                    let pur = parseFloat(purInput ? purInput.value : 0) || 0;

                    totalSalesAmount += (saleQty * mrp);
                    totalPurchaseCost += (pur * ws);
                    totalProfit += (saleQty * (mrp - ws));
                }
            }

            let cashRec = parseFloat(document.getElementById('cash_rec').value) || 0;
            let upiRec = parseFloat(document.getElementById('upi_rec').value) || 0;
            let netCashInHand = cashRec - totalExpenses;

            // Save globally for dashboard sync
            localStorage.setItem('live_sale', totalSalesAmount.toFixed(2));
            localStorage.setItem('live_purchase', totalPurchaseCost.toFixed(2));
            localStorage.setItem('live_expense', totalExpenses.toFixed(2));
            localStorage.setItem('live_net_cash', netCashInHand.toFixed(2));
            localStorage.setItem('live_profit', totalProfit.toFixed(2));
        }

        function saveInventoryData() {
            updateGrandTotals();
            alert('🚀 Inventory aur Daily Report successfully save aur sync ho gayi hai!');
        }

        function loadSavedInventory() {
            let savedExp = localStorage.getItem('live_expense');
            if (savedExp) {
                document.getElementById('daily_expense').value = savedExp;
            }
        }

        function filterTable() {
            let input = document.getElementById('search_box').value.toLowerCase();
            let table = document.getElementById('inventory_table');
            let tr = table.getElementsByTagName("tr");
            for (let i = 1; i < tr.length; i++) {
                let td = tr[i].getElementsByTagName("td")[1];
                if (td) {
                    let txtValue = td.textContent || td.innerText;
                    tr[i].style.display = txtValue.toLowerCase().indexOf(input) > -1 ? "" : "none";
                }
            }
        }
    </script>
